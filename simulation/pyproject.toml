[project]
name = "pixel-lane-simulation"
version = "0.1.0"
description = "Pixel Lane simulation/traffic-analysis package (Traffic Engine v1, no SUMO yet)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["pixel_lane_simulation*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
