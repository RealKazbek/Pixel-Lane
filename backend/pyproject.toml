[project]
name = "pixel-lane-backend"
version = "0.1.0"
description = "Pixel Lane backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  # PostGIS/SQLAlchemy integration for bbox-scoped spatial queries (see
  # docs/city-model.md's spatial schema section). A core runtime
  # dependency, not the OSM importer's optional extra: viewport-scoped
  # City Model reads need this on every request, not just at import time.
  "geoalchemy2>=0.15,<1.0",
  # Framework-independent Traffic Engine, a sibling package in this
  # monorepo (see ../simulation). The backend depends on it; it must never
  # depend back on the backend (see docs/architecture.md).
  "pixel-lane-simulation @ file:../simulation",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
]
# Isolated, optional: only `app/city/importers/osm/client.py` imports
# osmnx/networkx, and only when the OSM import CLI is actually run. The
# core backend runtime (FastAPI app, City Model, Traffic Engine adapter)
# never requires this group -- see AGENTS.md's dependency-isolation rule.
osm = [
  "osmnx>=2.0,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/Query() *must* be called in argument defaults --
# that's how FastAPI's dependency injection is designed to work.
ignore = ["B008"]

[tool.mypy]
# Matches the actual deployed runtime (Dockerfile: python:3.12-slim); also
# required for numpy's stubs (pulled in by the osmnx importer extra),
# which use 3.12-only type-statement syntax.
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
